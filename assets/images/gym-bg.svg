<svg width="1400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="lighting">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background walls -->
  <rect width="1400" height="600" fill="url(#wallGrad)"/>
  
  <!-- Left wall with accent stripe -->
  <rect width="200" height="600" fill="#0a0a0a"/>
  <rect width="200" height="600" fill="#FF6B35" opacity="0.08"/>
  <rect width="8" height="600" fill="#FF6B35" opacity="0.4"/>
  
  <!-- Floor -->
  <rect y="480" width="1400" height="120" fill="url(#floorGrad)"/>
  <rect y="475" width="1400" height="3" fill="#FF6B35"/>
  
  <!-- Lighting fixtures on ceiling -->
  <circle cx="300" cy="50" r="25" fill="#FFD700" opacity="0.3"/>
  <circle cx="700" cy="40" r="30" fill="#FFD700" opacity="0.35"/>
  <circle cx="1100" cy="50" r="25" fill="#FFD700" opacity="0.3"/>
  
  <!-- Right wall accent -->
  <rect x="1200" width="200" height="600" fill="#0a0a0a"/>
  <rect x="1200" width="200" height="600" fill="#FF6B35" opacity="0.08"/>
  
  <!-- Treadmills Section (Left) -->
  <g>
    <!-- Treadmill 1 -->
    <rect x="250" y="340" width="100" height="140" fill="#222" rx="4"/>
    <rect x="265" y="355" width="70" height="80" fill="#444"/>
    <ellipse cx="265" cy="455" rx="40" ry="12" fill="#333"/>
    
    <!-- Treadmill 2 -->
    <rect x="380" y="340" width="100" height="140" fill="#222" rx="4"/>
    <rect x="395" y="355" width="70" height="80" fill="#444"/>
    <ellipse cx="395" cy="455" rx="40" ry="12" fill="#333"/>
    
    <!-- Treadmill 3 -->
    <rect x="510" y="340" width="100" height="140" fill="#222" rx="4"/>
    <rect x="525" y="355" width="70" height="80" fill="#444"/>
    <ellipse cx="525" cy="455" rx="40" ry="12" fill="#333"/>
  </g>
  
  <!-- Dumbbells and Rack (Center) -->
  <g>
    <!-- Dumbbell stands -->
    <rect x="680" y="380" width="220" height="30" fill="#555" rx="2"/>
    
    <!-- Dumbbells -->
    <circle cx="710" cy="360" r="18" fill="#FF6B35"/>
    <circle cx="710" cy="360" r="12" fill="#E55A2B"/>
    <rect x="705" y="350" width="10" height="10" fill="#333"/>
    
    <circle cx="760" cy="360" r="18" fill="#FF6B35"/>
    <circle cx="760" cy="360" r="12" fill="#E55A2B"/>
    <rect x="755" y="350" width="10" height="10" fill="#333"/>
    
    <circle cx="810" cy="360" r="18" fill="#FF6B35"/>
    <circle cx="810" cy="360" r="12" fill="#E55A2B"/>
    <rect x="805" y="350" width="10" height="10" fill="#333"/>
    
    <circle cx="860" cy="360" r="18" fill="#FF6B35"/>
    <circle cx="860" cy="360" r="12" fill="#E55A2B"/>
    <rect x="855" y="350" width="10" height="10" fill="#333"/>
  </g>
  
  <!-- Gym Equipment (Right side) -->
  <g>
    <!-- Bench press area -->
    <rect x="980" y="330" width="140" height="150" fill="#1a1a1a" rx="4"/>
    <rect x="995" y="345" width="110" height="100" fill="#333"/>
    <rect x="1000" y="340" width="100" height="12" fill="#FF6B35" opacity="0.7"/>
    <ellipse cx="1050" cy="460" rx="55" ry="15" fill="#222"/>
    
    <!-- Weight plates stacked -->
    <rect x="1150" y="380" width="60" height="100" fill="#444"/>
    <rect x="1155" y="375" width="50" height="8" fill="#555"/>
    <rect x="1155" y="385" width="50" height="8" fill="#666"/>
    <rect x="1155" y="395" width="50" height="8" fill="#555"/>
    <rect x="1155" y="405" width="50" height="8" fill="#FF6B35" opacity="0.6"/>
  </g>
  
  <!-- Accent panels on walls -->
  <rect x="200" y="80" width="80" height="250" fill="#FF6B35" opacity="0.12"/>
  <rect x="200" y="80" width="80" height="250" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.2"/>
  
  <rect x="1120" y="100" width="80" height="280" fill="#FF6B35" opacity="0.12"/>
  <rect x="1120" y="100" width="80" height="280" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.2"/>
  
  <!-- Center branding area - subtle background -->
  <rect x="500" y="150" width="400" height="200" fill="#FF6B35" opacity="0.03"/>
  
  <!-- Gym name/branding subtle text -->
  <text x="700" y="280" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#FF6B35" text-anchor="middle" opacity="0.08">GYM</text>
  
  <!-- Reflections and light effects -->
  <circle cx="150" cy="120" r="180" fill="#FF6B35" opacity="0.04" filter="url(#lighting)"/>
  <circle cx="1250" cy="180" r="150" fill="#FF6B35" opacity="0.06" filter="url(#lighting)"/>
</svg>
